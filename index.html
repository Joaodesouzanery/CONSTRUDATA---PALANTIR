<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="O ConstruData conecta campo, medição, planejamento e custo em uma única fonte de verdade. Dados conectados para cada decisão da obra. Em produção em semanas." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph -->
    <meta property="og:title" content="ConstruData — A base operacional da sua obra" />
    <meta property="og:description" content="Sua obra está pronta? Cada RDO, cada medição, cada frente em uma única base operacional, em tempo real." />
    <meta property="og:type" content="website" />
    <!-- URLs absolutas: crawlers de prévia de link não resolvem caminho relativo. -->
    <meta property="og:url" content="https://www.construdata.software/" />
    <meta property="og:site_name" content="ConstruData" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://www.construdata.software/obras/hero-slide-1.webp" />
    <meta property="og:image:width" content="1408" />
    <meta property="og:image:height" content="768" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConstruData — A base operacional da sua obra" />
    <meta name="twitter:description" content="Sua obra está pronta? Campo, medição, planejamento e custo em uma única fonte de verdade." />
    <meta name="twitter:image" content="https://www.construdata.software/obras/hero-slide-1.webp" />
    <link rel="canonical" href="https://www.construdata.software/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preload da imagem do hero: baixa durante o parse do HTML (antes do bundle JS),
         eliminando o flash preto na abertura da landing. -->
    <link rel="preload" as="image" href="/obras/hero-slide-1.webp" fetchpriority="high" />
    <title>ConstruData — A base operacional da sua obra</title>
    <!-- As fontes são servidas do próprio domínio (ver @font-face em src/styles/globals.css).
         Antes vinham do Google Fonts, o que custava uma folha de estilo de terceiro bloqueando
         a renderização e deixava a página cair na fonte padrão do navegador em redes que
         bloqueiam o Google. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
